    <!-- 공유 미리보기(카카오톡·SNS). 만화별 주소(/c/…)와 홈(/)은 서버가 이 값을 그 페이지에 맞게 바꿔서 보낸다. og:url·canonical 도 서버가 넣는다. -->
    <meta property="og:site_name" content="오늘의 4컷" />
    <meta property="og:locale" content="ko_KR" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="오늘의 4컷 – 하루 한 번, 피식 웃고 시작하는 4컷 만화" />
    <meta property="og:description" content="하루 한 번, 피식 웃고 시작하는 4컷 만화" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="오늘의 4컷 – 하루 한 번, 피식 웃고 시작하는 4컷 만화" />
    <meta name="twitter:description" content="하루 한 번, 피식 웃고 시작하는 4컷 만화" />
    <meta name="twitter:image" content="https://comic.seunglabs.com/og-default.png" />
    <meta name="apple-mobile-web-app-title" content="오늘의 4컷" />
    <script>
      // 방문 분석: Google Analytics(GA4) + Microsoft Clarity.
      // 관리자 화면(/admin)에서는 아무것도 불러오지 않는다. gtag/clarity 함수도 만들지 않아서 이벤트도 기록되지 않는다.
      (function () {
        var GA_ID = 'G-9DS3G79485';
        var CLARITY_ID = 'ze1ppcbdbz';
        var p = location.pathname;
        if (p === '/admin' || p.indexOf('/admin/') === 0) return;

        // 함수는 바로 만들어 둔다: 외부 스크립트가 도착하기 전의 이벤트도 쌓였다가 전송된다
        window.dataLayer = window.dataLayer || [];
        window.gtag = function () {
          window.dataLayer.push(arguments);
        };
        window.gtag('js', new Date());
        window.gtag('config', GA_ID);
        window.clarity =
          window.clarity ||
          function () {
            (window.clarity.q = window.clarity.q || []).push(arguments);
          };

        // 외부 스크립트는 화면이 다 그려지고 한가해진 뒤에 불러온다 (PageSpeed 점수를 지키기 위해)
        function load(src) {
          var s = document.createElement('script');
          s.async = true;
          s.src = src;
          document.head.appendChild(s);
        }
        function start() {
          load('https://www.googletagmanager.com/gtag/js?id=' + GA_ID);
          load('https://www.clarity.ms/tag/' + CLARITY_ID);
        }
        function whenIdle() {
          if (window.requestIdleCallback) window.requestIdleCallback(start, { timeout: 3000 });
          else setTimeout(start, 2000);
        }
        if (document.readyState === 'complete') whenIdle();
        else window.addEventListener('load', whenIdle);
      })();
    </script>
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" sizes="any" />
    <link rel="icon" type="image/png" href="/favicon-32x32.png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- 폰트는 우리 서버에서 내려준다(/fonts). 외부(Google Fonts) 요청이 없어 화면 표시가 막히지 않는다. 아이콘 폰트는 화면에 바로 쓰여서 미리 불러온다. -->
    <link rel="preload" href="/fonts/material-symbols-subset-v2.woff2" as="font" type="font/woff2" crossorigin />
    <title>오늘의 4컷 – 하루 한 번, 피식 웃고 시작하는 4컷 만화</title>
